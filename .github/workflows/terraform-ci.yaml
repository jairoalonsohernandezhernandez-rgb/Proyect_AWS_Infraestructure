name: "Terraform CI/CD"

on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: "Terraform Plan & Apply"
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: terraform/environments/dev

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS mediante OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan

      - name: Extract Terraform Outputs to Environment
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          # Como estamos en terraform/environments/dev, subimos dos niveles para apuntar a la raíz del proyecto de terraform si es necesario, 
          # o ejecutamos el output indicando el state de dev. Aquí lo ideal es:
          echo "SQS_QUEUE_URL=$(terraform output -raw sqs_queue_url)" >> $GITHUB_ENV
          echo "S3_BUCKET_NAME=$(terraform output -raw s3_bucket_name)" >> $GITHUB_ENV
          echo "LAMBDA_FUNCTION_NAME=$(terraform output -raw lambda_function_name)" >> $GITHUB_ENV
          echo "API_GATEWAY_ID=$(terraform output -raw api_gateway_id)" >> $GITHUB_ENV

      - name: Set up Python
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          python -m pip install --upgrade pip
          pip install boto3

      - name: Run Metrics Exporter
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: Telemetry
        run: python metrics_exporter.py

      - name: Upload Metrics Artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: prometheus-metrics
          path: Telemetry/metrics.prom